}

.story { overflow:hidden; }
.blk { position:relative; width:100%; z-index:1; }
.blk.gap { height:calc(55 * var(--vw)); }                  
.blk .bg { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
.it { position:absolute; left:var(--l); top:var(--t); width:var(--w); z-index:2; will-change:transform;

.photo { aspect-ratio:4/5; }
.text  { min-height:calc(11 * var(--vw)); }
.deco  { aspect-ratio:1; border-radius:50%; }
.clean .it { border:0; background:none; text-shadow:none; }
.clean .it::after { content:none; }
.it img, .it.solo { transition:opacity .7s ease; }
.hid { opacity:0; }

.end { background:#fff; color:#14213d; min-height:100vh; min-height:100svh;

<script>
const DESIGN_W = 1440, DESIGN_H = 760;
const STORY_W = 1440;
const MOBILE_ZOOM = 1;
const MOBILE_K = 0.6;

const hero = document.querySelector('.hero');
const stage = document.getElementById('stage');
const story = document.querySelector('.story');
if (!hero || !story) console.warn('Вставьте свой код (header и main) на место комментария.');
const wrap = document.createElement('div');
if (story) { story.before(wrap); wrap.appendChild(story); }
document.querySelectorAll('.story [style*="vw"]').forEach(el => {
  el.setAttribute('style', el.getAttribute('style')
    .replace(/(-?[\d.]+)vw/g, 'calc($1 * var(--vw))'));
});

const layers = [...document.querySelectorAll('[data-speed]')].map(el => ({
  el, s: parseFloat(el.dataset.speed), box: el.closest('[data-parallax]'),
  zone: el.closest('#stage') ? 'hero' : 'story', item: el.classList.contains('it')
}));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let heroScale = 1, storyScale = 1, phone = false, queued = false;
function fit() {
  if (!hero || !story) return;
  phone = innerWidth < 700 || innerWidth / innerHeight < 1.1;
  if (!phone) {
    stage.style.cssText = ''; hero.style.height = '';
    story.style.cssText = ''; wrap.style.cssText = '';
    heroScale = storyScale = 1; return;
  }
  heroScale = innerWidth / DESIGN_W * MOBILE_ZOOM;
  stage.style.cssText =
    `inset:auto;top:0;width:${DESIGN_W}px;height:${DESIGN_H}px;` +
    `left:${(innerWidth - DESIGN_W * heroScale) / 2}px;` +
    `transform:scale(${heroScale});transform-origin:0 0;`;
  hero.style.height = (DESIGN_H * heroScale) + 'px';

  storyScale = innerWidth / STORY_W;
  story.style.cssText =
    `width:${STORY_W}px;--vw:${STORY_W / 100}px;` +
    `transform:scale(${storyScale});transform-origin:0 0;`;
  wrap.style.cssText = `height:${story.offsetHeight * storyScale}px;overflow:hidden;`;
}

function update() {
  queued = false;
  const vh = innerHeight, k = phone ? MOBILE_K : 1;
  for (const L of layers) {
    const r = L.box.getBoundingClientRect();
    if (r.bottom < -50 || r.top > vh + 50) continue;
    let shift;
    if (L.item) {
      const p = L.el.parentElement.getBoundingClientRect();
      shift = reduce ? 0 : (L.s - 1) * ((p.top + p.height / 2) - vh / 2) * k;
    } else {
      const scrolled = Math.min(Math.max(-r.top, 0), r.height);
      shift = reduce ? 0 : scrolled * (1 - L.s) * k;
    }
    shift /= (L.zone === 'hero' ? heroScale : storyScale);  
    L.el.style.transform = `translate3d(0,${shift.toFixed(1)}px,0)`;
  }
}
function onScroll() { if (!queued) { queued = true; requestAnimationFrame(update); } }
function onResize() { fit(); onScroll(); }

if (!reduce && 'IntersectionObserver' in window) {
  const io = new IntersectionObserver(
    es => es.forEach(e => e.target.classList.toggle('hid', !e.isIntersecting)),
    { rootMargin: '-8% 0px -8% 0px' });   
  document.querySelectorAll('.story .it').forEach(it => {
    const imgs = it.querySelectorAll('img');
    if (imgs.length) imgs.forEach(i => io.observe(i));
    else { it.classList.add('solo'); io.observe(it); }
  });
}

addEventListener('scroll', onScroll, { passive: true });
addEventListener('resize', onResize);
addEventListener('load', onResize);
fit(); update();
</script>
